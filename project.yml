name: Scriber
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  ScriberCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/ScriberCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.scriber.core
        PRODUCT_NAME: ScriberCore
  Scriber:
    type: application
    platform: macOS
    sources:
      - path: Sources/Scriber
      - path: ContextFiles
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: ScriberCore
      - sdk: Carbon.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.scriber
        PRODUCT_NAME: Whittle
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true
        OTHER_LDFLAGS: "$(inherited)"
  ScriberTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ScriberTests
    dependencies:
      - target: ScriberCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.scriber.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  Scriber:
    build:
      targets:
        Scriber: all
        ScriberTests: [test]
    test:
      targets:
        - ScriberTests
      gatherCoverageData: false
